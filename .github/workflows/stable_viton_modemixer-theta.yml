name: Build and deploy FastAPI app to Azure Web App - modemixer-theta

on:
  push:
    branches:
      - stable_VITON
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Create and start virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc python3-dev wget xfonts-75dpi xfonts-base libjpeg-turbo8
          wget https://github.com/wkhtmltopdf/packaging/releases/download/0.12.6-1/wkhtmltox_0.12.6-1.focal_amd64.deb
          sudo dpkg -i wkhtmltox_0.12.6-1.focal_amd64.deb || sudo apt-get install -f -y
          sudo apt-get clean && sudo rm -rf /var/lib/apt/lists/* /wkhtmltox_0.12.6-1.focal_amd64.deb
      - name: Create startup command
        run: |
          echo '#!/bin/bash' > startup.sh
          echo 'uvicorn app.main:app --host 0.0.0.0 --port 80' >> startup.sh
          chmod +x startup.sh
      - name: Zip artifact for deployment
        run: zip release.zip ./* -r
      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            release.zip
            !venv/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: "production"
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Unzip artifact for deployment
        run: unzip release.zip

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: "Deploy to Azure Web App"
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: "modemixer-theta"
          slot-name: "production"
          publish-profile: ${{ secrets.AzureAppService_PublishProfile_5414ec0945ea43ea80a8b419744258f6 }}

      - name: Configure Web App settings
        uses: azure/appservice-settings@v1
        with:
          app-name: "modemixer-theta"
          app-settings-json: |
            [
              {
                "name": "WEBSITES_PORT",
                "value": "80"
              },
              {
                "name": "WEBSITE_RUN_FROM_PACKAGE",
                "value": "1"
              },
              {
                "name": "WEBSITES_CONTAINER_START_TIME_LIMIT",
                "value": "1800"
              },
              {
                "name": "SCM_DO_BUILD_DURING_DEPLOYMENT",
                "value": "1"
              }
            ]
