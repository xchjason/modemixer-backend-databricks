name: Build and deploy FastAPI app to Azure Web App - modemixer-theta

on:
  push:
    branches:
      - stable_VITON
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Create and start virtual environment
        run: |
          python -m venv antenv
          source antenv/bin/activate

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install gunicorn

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc python3-dev wget xfonts-75dpi xfonts-base libjpeg-turbo8
          wget https://github.com/wkhtmltopdf/packaging/releases/download/0.12.6-1/wkhtmltox_0.12.6-1.focal_amd64.deb
          sudo dpkg -i wkhtmltox_0.12.6-1.focal_amd64.deb || sudo apt-get install -f -y
          sudo apt-get clean && sudo rm -rf /var/lib/apt/lists/* /wkhtmltox_0.12.6-1.focal_amd64.deb

      - name: Create startup script
        run: |
          cat > startup.sh << EOL
          #!/bin/bash
          set -e
          set -x
          cd /home/site/wwwroot
          source antenv/bin/activate
          exec gunicorn app.main:app --bind=0.0.0.0:8000 --workers=4 --worker-class=uvicorn.workers.UvicornWorker --timeout 600 --access-logfile='-' --error-logfile='-'
          EOL
          chmod +x startup.sh

      - name: Create deployment package
        run: |
          zip -r package.zip . -x "*.git*" "*.github*" "*.vscode*" "antenv/*"

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: package.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: "production"
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: "Deploy to Azure Web App"
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: "modemixer-theta"
          slot-name: "production"
          publish-profile: ${{ secrets.AzureAppService_PublishProfile_5414ec0945ea43ea80a8b419744258f6 }}
          package: package.zip

      - name: Configure Web App settings
        uses: azure/appservice-settings@v1
        with:
          app-name: "modemixer-theta"
          app-settings-json: |
            [
              {
                "name": "SCM_DO_BUILD_DURING_DEPLOYMENT",
                "value": "true"
              },
              {
                "name": "WEBSITE_RUN_FROM_PACKAGE",
                "value": "1"
              },
              {
                "name": "WEBSITES_PORT",
                "value": "8000"
              },
              {
                "name": "STARTUP_COMMAND",
                "value": "/home/site/wwwroot/startup.sh"
              }
            ]
